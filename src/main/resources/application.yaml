spring:
  application:
    name: robust-delivery-platform

  datasource:
    url: jdbc:mysql://localhost:3306/delivery_db
    username: delivery_user
    password: delivery_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # LOCAL DEVELOPMENT ONLY. The neon profile overrides this with ${JWT_SECRET}
    # and refuses to start with this value (prefix "dev-insecure-").
    secret: ${JWT_SECRET:dev-insecure-local-only-jwt-secret-change-me-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.flywaydb.core.internal.database.base.Database: ERROR