spring:
  datasource:
    url: ${NEON_JDBC_URL:${DATABASE_URL:}}
    username: ${NEON_DB_USERNAME:}
    password: ${NEON_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration-postgresql

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Required in production. No default: startup fails if JWT_SECRET is
    # missing or shorter than 32 bytes. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.flywaydb.core.internal.database.base.Database: ERROR
